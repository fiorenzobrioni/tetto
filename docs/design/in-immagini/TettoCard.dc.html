<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tetto, In immagini</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Roboto+Flex:opsz,wght@8..144,300..800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; border-radius: 24px; overflow: hidden; box-sizing: border-box; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: {{g.ink}}; box-shadow: 0 12px 28px -14px rgba(10,12,60,0.55)">
  <div style="position: absolute; inset: 0; background: {{g.layer}}; opacity: {{op}}"></div>

  <sc-if value="{{is21}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; height: 100%; box-sizing: border-box; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
      <div style="position: relative; width: 30px; height: 58px; flex: 0 0 30px">
        <sc-for list="{{c21.cols}}" as="c" hint-placeholder-count="1">
          <svg width="30" height="58" viewBox="0 0 30 58" style="position: absolute; left: 0; top: 0; overflow: visible" aria-hidden="true"><path d="{{c.roof}}" fill="none" stroke="{{c.roofInk}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="position: absolute; left: {{c.bx}}px; top: {{c.by}}px; width: {{c.bw}}px; height: {{c.bh}}px; border-radius: 4px; background: {{g.track}}; overflow: hidden">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{c.fh}}px; background: {{c.fill}}"></div>
          </div>
          <div style="position: absolute; left: {{c.mlx}}px; top: {{c.my}}px; width: 4px; height: 2px; border-radius: 1px; background: {{g.ink}}"></div>
          <div style="position: absolute; left: {{c.mrx}}px; top: {{c.my}}px; width: 4px; height: 2px; border-radius: 1px; background: {{g.ink}}"></div>
        </sc-for>
      </div>
      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <div style="font-size: 13px; line-height: 16px; color: {{g.quiet}}">Uscite</div>
        <div style="font-size: 16px; line-height: 20px; font-weight: 600; color: {{g.over}}">{{overWords}}</div>
        <div style="font-size: 11px; line-height: 13px; color: {{g.quiet}}">riparte il 1° dic</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{is41}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; height: 100%; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 16px">
      <div style="position: relative; width: {{c41.w}}px; height: 58px; flex: 0 0 auto">
        <sc-for list="{{c41.cols}}" as="c" hint-placeholder-count="5">
          <svg width="{{c41.w}}" height="58" viewBox="{{c41.box}}" style="position: absolute; left: 0; top: 0; overflow: visible" aria-hidden="true"><path d="{{c.roof}}" fill="none" stroke="{{c.roofInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="position: absolute; left: {{c.bx}}px; top: {{c.by}}px; width: {{c.bw}}px; height: {{c.bh}}px; border-radius: 3px; background: {{g.track}}; overflow: hidden">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{c.fh}}px; background: {{c.fill}}"></div>
          </div>
          <div style="position: absolute; left: {{c.mlx}}px; top: {{c.my}}px; width: 3px; height: 2px; border-radius: 1px; background: {{g.ink}}"></div>
          <div style="position: absolute; left: {{c.mrx}}px; top: {{c.my}}px; width: 3px; height: 2px; border-radius: 1px; background: {{g.ink}}"></div>
        </sc-for>
      </div>
      <div style="flex: 1 1 0; min-width: 0; font-size: 16px; line-height: 20px; font-weight: 500">{{sentence}}</div>
    </div>
  </sc-if>

  <sc-if value="{{tall}}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; height: 100%; box-sizing: border-box; padding: {{pad}}; display: flex; flex-direction: column; gap: 8px">
      <sc-if value="{{headerOn}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 2px; min-height: {{headH}}px">
          <sc-if value="{{sentenceOn}}" hint-placeholder-val="{{ true }}">
            <div style="font-size: {{sentSize}}px; line-height: {{sentLine}}px; font-weight: 500">{{sentence}}</div>
          </sc-if>
          <sc-if value="{{factsOn}}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 13px; line-height: 17px; color: {{g.quiet}}">{{facts}}</div>
          </sc-if>
        </div>
      </sc-if>
      <div style="position: relative; flex: 1 1 auto; border-radius: 16px; background: {{g.plate}}; box-shadow: inset 0 0 0 1px {{g.hair}}">
        <sc-for list="{{ct.cols}}" as="c" hint-placeholder-count="5">
          <svg width="{{ct.w}}" height="{{ct.h}}" viewBox="{{ct.box}}" style="position: absolute; left: 0; top: 0; overflow: visible" aria-hidden="true"><path d="{{c.roof}}" fill="none" stroke="{{c.roofInk}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="position: absolute; left: {{c.bx}}px; top: {{c.by}}px; width: {{c.bw}}px; height: {{c.bh}}px; border-radius: 5px; background: {{g.track}}; overflow: hidden">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{c.fh}}px; background: {{c.fill}}"></div>
          </div>
          <div style="position: absolute; left: {{c.mlx}}px; top: {{c.my}}px; width: 5px; height: 2px; border-radius: 1px; background: {{g.ink}}"></div>
          <div style="position: absolute; left: {{c.mrx}}px; top: {{c.my}}px; width: 5px; height: 2px; border-radius: 1px; background: {{g.ink}}"></div>
          <div style="position: absolute; left: {{c.lx}}px; top: {{c.ly}}px; width: {{c.lw}}px; text-align: center; display: flex; flex-direction: column; gap: 1px">
            <div style="font-size: 13px; line-height: 15px; font-weight: 600; color: {{c.amountInk}}; white-space: nowrap">{{c.amount}}</div>
            <div style="font-size: 11px; line-height: 13px; color: {{g.quiet}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</div>
            <sc-if value="{{ct.periods}}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 11px; line-height: 13px; color: {{g.quiet}}; white-space: nowrap">{{c.until}}</div>
            </sc-if>
          </div>
        </sc-for>
        <sc-if value="{{ct.legend}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; align-items: center; gap: 8px; font-size: 11px; line-height: 13px; color: {{g.quiet}}">
            <span style="display: flex; gap: 6px; align-items: center"><span style="width: 5px; height: 2px; background: {{g.ink}}; border-radius: 1px"></span><span style="width: 8px; height: 8px; border-radius: 2px; background: {{g.track}}"></span><span style="width: 5px; height: 2px; background: {{g.ink}}; border-radius: 1px"></span></span>
            <span>Le tacche: dove saresti spendendo pari ogni giorno</span>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","options":["21","41","22","32","42","23","43","44"],"default":"42"},"ground":{"editor":"enum","options":["app","light","dark","blue","azure","green","teal","plum","clay"],"default":"app"},"opacity":{"editor":"range","min":20,"max":100,"step":5,"default":100},"sentenceOn":{"editor":"boolean","default":true},"hideAmounts":{"editor":"boolean","default":false},"$preview":{"width":340,"height":189}}'>
var SIZES = {'21':[159,85],'41':[340,85],'22':[159,189],'32':[250,189],'42':[340,189],'23':[159,293],'43':[340,293],'44':[340,397]};
var CAPS = [
  {name:'Spesa',cap:400,spent:212,days:15/30,until:'al 1° dic'},
  {name:'Caffè',cap:20,spent:12,days:1,until:'a lunedì'},
  {name:'Uscite',cap:150,spent:165,days:15/30,until:'al 1° dic'},
  {name:'Benzina',cap:120,spent:48,days:15/30,until:'al 1° dic'},
  {name:'Libri',cap:200,spent:164,days:319/365,until:'al 1° gen'}
];
var COLORS = {blue:'#0F3B6B',azure:'#0F5580',green:'#17572E',teal:'#0F5B5B',plum:'#4A2C63',clay:'#7A3320'};
var WHITE = {ink:'#FFFFFF',quiet:'rgba(255,255,255,0.75)',hair:'rgba(255,255,255,0.12)',track:'rgba(255,255,255,0.16)',accent:'#FFFFFF',attention:'#FFBC27',over:'#FFB4AB',plate:'rgba(0,0,0,0.18)'};
function ground(key){
  if(key==='light')return {layer:'#FCF9F3',ink:'#1E1B17',quiet:'#4F4639',hair:'rgba(30,27,23,0.10)',track:'rgba(30,27,23,0.09)',accent:'#835500',attention:'#7A5200',over:'#BA1A1A',plate:'rgba(131,85,0,0.05)'};
  if(key==='dark')return {layer:'#16130E',ink:'#E9E1D8',quiet:'rgba(233,225,216,0.74)',hair:'rgba(255,255,255,0.08)',track:'rgba(255,255,255,0.10)',accent:'#FFB957',attention:'#FFBC27',over:'#FFB4AB',plate:'rgba(255,255,255,0.05)'};
  if(COLORS[key])return Object.assign({},WHITE,{layer:COLORS[key]});
  return Object.assign({},WHITE,{layer:'linear-gradient(150deg,#4750BC 0%,#3C44AA 55%,#2F3796 100%)',plate:'rgba(8,10,50,0.26)'});
}
function f(v){return v.toFixed(1);}
function money(n,hide){return hide?'•••':(n+' €');}
function columns(caps,w,opt,g,hide){
  var n=caps.length,slot=(w-2*opt.pad)/n,cw=opt.cw;
  var cols=caps.map(function(c,i){
    var cx=opt.pad+slot*i+slot/2,bx=cx-cw/2,by=opt.eaves,bh=opt.bottom-opt.eaves;
    var share=c.spent/c.cap,over=share>1,ahead=!over&&share>c.days+0.02;
    var fh=Math.min(share,1)*bh,my=by+bh-c.days*bh-1;
    var roof='M'+f(bx-3)+' '+f(opt.eaves-1)+' L'+f(cx)+' '+f(opt.peak)+' L'+f(bx+cw+3)+' '+f(opt.eaves-1);
    var left=c.cap-c.spent;
    return {bx:f(bx),by:f(by),bw:f(cw),bh:f(bh),fh:f(fh),fill:over?g.over:(ahead?g.attention:g.accent),roof:roof,roofInk:over?g.over:g.ink,
      mlx:f(bx-opt.tick-2),mrx:f(bx+cw+2),my:f(Math.max(by,Math.min(by+bh-2,my))),
      lx:f(cx-slot/2),lw:f(slot),ly:f(opt.bottom+5),
      amount:over?((hide||slot<56)?'sotto':'sotto '+money(-left,false)):money(left,hide),amountInk:over?g.over:g.ink,
      name:c.name,until:'fino '+c.until};
  });
  return {cols:cols,w:w,h:opt.h,box:'0 0 '+w+' '+opt.h,periods:!!opt.periods,legend:!!opt.legend};
}
class Component extends DCLogic {
  renderVals() {
    var p=this.props,size=p.size||'42',g=ground(p.ground||'app'),dims=SIZES[size]||SIZES['42'],hide=!!p.hideAmounts;
    var sentenceOn=p.sentenceOn!==false;
    var sentence=hide?'Uscite è sotto. Riparte il 1° dicembre.':'Uscite è sotto di 15 €. Riparte il 1° dicembre.';
    var tall=size!=='21'&&size!=='41';
    var ct;
    if(size==='22')ct=columns(CAPS.slice(0,3),135,{pad:4,cw:22,peak:8,eaves:18,bottom:62,h:110,tick:5},g,hide);
    else if(size==='23')ct=columns(CAPS.slice(0,3),135,{pad:4,cw:22,peak:10,eaves:22,bottom:122,h:180,tick:5,periods:true},g,hide);
    else if(size==='32')ct=columns(CAPS.slice(0,4),226,{pad:4,cw:26,peak:7,eaves:16,bottom:54,h:95,tick:5},g,hide);
    else if(size==='43')ct=columns(CAPS,312,{pad:6,cw:32,peak:10,eaves:24,bottom:140,h:199,tick:5,periods:true},g,hide);
    else if(size==='44')ct=columns(CAPS,312,{pad:6,cw:34,peak:12,eaves:28,bottom:222,h:303,tick:5,periods:true,legend:true},g,hide);
    else ct=columns(CAPS,312,{pad:6,cw:30,peak:6,eaves:15,bottom:52,h:95,tick:5},g,hide);
    var c21=columns([CAPS[2]],30,{pad:0,cw:22,peak:2,eaves:12,bottom:56,h:58,tick:3},g,hide);
    c21.cols[0].mlx=f(4-5);c21.cols[0].mrx=f(26+1);
    var c41=columns(CAPS,110,{pad:0,cw:12,peak:4,eaves:12,bottom:56,h:58,tick:3},g,hide);
    var factsOn=size!=='22'&&size!=='23';
    return {
      w:dims[0],h:dims[1],g:g,op:((p.opacity==null?100:p.opacity)/100).toFixed(2),
      is21:size==='21',is41:size==='41',tall:tall,
      pad:(size==='22'||size==='23')?'12px':'14px 14px 12px',
      headerOn:sentenceOn||factsOn,sentenceOn:sentenceOn,factsOn:factsOn,
      headH:(size==='22')?48:(size==='23'?60:(sentenceOn?57:17)),
      sentSize:(size==='22')?13:16,sentLine:(size==='22')?16:20,
      sentence:sentence,facts:size==='32'?'4 di 5 tetti':'5 tetti · domenica 15 novembre',
      overWords:hide?'sotto':'sotto di 15 €',
      ct:ct,c21:c21,c41:c41
    };
  }
}
</script>
</body>
</html>
